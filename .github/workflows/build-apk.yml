name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build web assets (www)
        run: npx vite build --outDir www

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK (manual)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -s -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Add Android platform
        run: npx cap add android

      - name: Make status bar white (match app)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          inject='        <item name="android:statusBarColor">#FFFFFF</item>\n        <item name="android:windowLightStatusBar">true</item>\n'
          if 'statusBarColor' not in s:
              s=s.replace('<item name="android:background">@null</item>',
                          '<item name="android:background">@null</item>\n'+inject)
          open(p,'w').write(s)
          print('statusBarColor patched' if 'statusBarColor' in s else 'FAILED')
          PY

      - name: Disable system font scaling in WebView (锁定APP内字号，不随老人模式/系统字体放大)
        run: |
          python3 - <<'PY'
          import glob
          files = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if not files:
              print('MainActivity.java NOT FOUND'); raise SystemExit(1)
          p = files[0]
          s = open(p).read()
          if 'setTextZoom' not in s:
              if 'import android.os.Bundle;' not in s:
                  s = s.replace('import com.getcapacitor.BridgeActivity;',
                                'import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;')
              s = s.replace(
                  'public class MainActivity extends BridgeActivity {',
                  'public class MainActivity extends BridgeActivity {\n'
                  '    @Override\n'
                  '    public void onCreate(Bundle savedInstanceState) {\n'
                  '        super.onCreate(savedInstanceState);\n'
                  '        lockTextZoom();\n'
                  '    }\n'
                  '    @Override\n'
                  '    public void onResume() {\n'
                  '        super.onResume();\n'
                  '        lockTextZoom();\n'
                  '    }\n'
                  '    private void lockTextZoom() {\n'
                  '        if (getBridge() != null && getBridge().getWebView() != null) {\n'
                  '            getBridge().getWebView().getSettings().setTextZoom(100);\n'
                  '        }\n'
                  '    }'
              )
              open(p, 'w').write(s)
              print('patched MainActivity: setTextZoom(100) via onCreate+onResume')
          else:
              print('already patched')
          PY

      - name: Sync web assets (copy only, 不重建原生工程以免覆盖 MainActivity patch)
        run: npx cap copy android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chun-jing-jia-kao-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 纯净驾考 APK（自动构建 #${{ github.run_number }}）
          make_latest: true
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
